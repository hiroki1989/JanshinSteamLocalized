workflows:
  unity-ios-build:
    name: Unity iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      vars:
        UNITY_VERSION: "6000.4.0f1"
      xcode: latest
    scripts:
      - name: Set Unity path
        script: |
          UNITY_BIN="/Applications/Unity/Hub/Editor/$UNITY_VERSION/Unity.app/Contents/MacOS/Unity"
          if [ ! -f "$UNITY_BIN" ]; then
            echo "Unity not found at $UNITY_BIN"
            echo "Available versions:"
            ls /Applications/Unity/Hub/Editor/ || echo "No Unity versions found"
            exit 1
          fi
          echo "UNITY_BIN=$UNITY_BIN" >> $CM_ENV

      - name: Activate Unity License
        script: |
          "$UNITY_BIN" \
            -batchmode -quit -nographics \
            -logFile - \
            -username "$UNITY_EMAIL" \
            -password "$UNITY_PASSWORD" || true

      - name: Build Unity iOS Project
        script: |
          "$UNITY_BIN" \
            -batchmode -quit -nographics \
            -logFile - \
            -projectPath . \
            -buildTarget iOS \
            -executeMethod BuildScript.BuildIOS

    artifacts:
      - ios_build/**