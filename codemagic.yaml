workflows:
  unity-ios-build:
    name: Unity iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      vars:
        UNITY_VERSION: "6000.4.0f1"
      xcode: latest
    scripts:
      - name: Install Unity Hub
        script: |
          brew install --cask unity-hub || true
          sleep 5

      - name: Install Unity with iOS module
        script: |
          /Applications/Unity\ Hub.app/Contents/MacOS/Unity\ Hub -- --headless install \
            --version $UNITY_VERSION \
            --module ios
          sleep 5
          echo "Installed versions:"
          ls /Applications/Unity/Hub/Editor/ || true

      - name: Activate Unity License
        script: |
          UNITY_BIN="/Applications/Unity/Hub/Editor/$UNITY_VERSION/Unity.app/Contents/MacOS/Unity"
          "$UNITY_BIN" \
            -batchmode -quit -nographics \
            -logFile - \
            -username "$UNITY_EMAIL" \
            -password "$UNITY_PASSWORD" || true

      - name: Build Unity iOS Project
        script: |
          UNITY_BIN="/Applications/Unity/Hub/Editor/$UNITY_VERSION/Unity.app/Contents/MacOS/Unity"
          "$UNITY_BIN" \
            -batchmode -quit -nographics \
            -logFile - \
            -projectPath . \
            -buildTarget iOS \
            -executeMethod BuildScript.BuildIOS

    artifacts:
      - ios_build/**