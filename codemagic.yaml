workflows:
  unity-ios-build:
    name: Unity iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      vars:
        UNITY_VERSION: "6000.4.0f1"
        UNITY_CHANGESET: "8cf496087c8f"
      xcode: latest
    scripts:
      - name: Download and Install Unity
        script: |
          curl -L -o Unity.pkg \
            "https://download.unity3d.com/download_unity/$UNITY_CHANGESET/MacEditorInstaller/Unity.pkg"
          sudo installer -pkg Unity.pkg -target /
          rm Unity.pkg

      - name: Install iOS Support Module
        script: |
          curl -L -o iOSSupport.pkg \
            "https://download.unity3d.com/download_unity/$UNITY_CHANGESET/MacEditorTargetInstaller/UnitySetup-iOS-Support-for-Editor-$UNITY_VERSION.pkg"
          sudo installer -pkg iOSSupport.pkg -target /
          rm iOSSupport.pkg

      - name: Find Unity binary
        script: |
          UNITY_BIN=$(find /Applications/Unity* -name "Unity" -type f -path "*/MacOS/Unity" 2>/dev/null | head -1)
          echo "Found Unity at: $UNITY_BIN"
          echo "UNITY_BIN=$UNITY_BIN" >> $CM_ENV

      - name: Activate Unity License
        script: |
          mkdir -p "/Library/Application Support/Unity/"
          echo "$UNITY_LICENSE" > "/Library/Application Support/Unity/Unity_lic.ulf"
          echo "License file installed"

      - name: Build Unity iOS Project
        script: |
          "$UNITY_BIN" \
            -batchmode -quit -nographics \
            -logFile - \
            -projectPath . \
            -buildTarget iOS \
            -executeMethod BuildScript.BuildIOS

    artifacts:
      - ios_build/**